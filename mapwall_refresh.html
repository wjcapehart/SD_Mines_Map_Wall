    <script type="text/javascript">

      function startTime() {
        const month = ["January","February","March","April","May","June","July","August","September","October","November","December"]
        const wkday = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
        const today = new Date();

        let h = today.getUTCHours();
        let hL = today.getHours();
        //let TZ = today.getZone();

        let m   = today.getUTCMinutes();
        let s   = today.getUTCSeconds();
        let y   = today.getUTCFullYear();
        let d   = today.getUTCDate();
        let mm  = today.getUTCMonth();
        let dw  = today.getUTCDay();

        h = checkTime(h);
        hL = checkTime(hL);
        m = checkTime(m);
        s = checkTime(s);
        d = checkTime(d);

        document.getElementById('UTC_Clock').innerHTML =  h + ":" + m + ":" + s + " UTC (" + hL + ":" + m+ " MT)<br>"+ wkday[dw]+" " + d + " " + month[mm] + " " + y;
        setTimeout(startTime, 1000);
      }

      function checkTime(i) {
        if (i < 10) {i = "0" + i};  // add zero in front of numbers < 10
        return i;
      }


       


    </script>
